name: Event Reminders

on:
  schedule:
    # 01:00 UTC = 08:00 Việt Nam
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    # Set repository variable REMINDER_SCHEDULER=external before enabling
    # cron-job.org. Late GitHub schedule events then skip sending email.
    if: github.event_name == 'workflow_dispatch' || vars.REMINDER_SCHEDULER != 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Send tomorrow event reminders
        run: npm run reminder:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: Campus Event Hub
