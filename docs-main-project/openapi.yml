components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer Token cấp từ Laravel Sanctum sau khi đăng nhập thành công.
    KioskTokenAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Token phiên trình chiếu hội trường được cấp từ bảng `phien_kiosk`.
  responses:
    ValidationError:
      description: Dữ liệu gửi lên không vượt qua Form Request Validation (HTTP 422)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: VALIDATION_FAILED
              message:
                type: string
                example: Dữ liệu không hợp lệ
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    UnauthorizedError:
      description: Chưa xác thực hoặc Token không hợp lệ (HTTP 401)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: UNAUTHORIZED
              message:
                type: string
                example: Vui lòng đăng nhập để tiếp tục
    ForbiddenError:
      description: Không có quyền truy cập theo vai trò RBAC (HTTP 403)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: FORBIDDEN
              message:
                type: string
                example: Bạn không có quyền thực hiện thao tác này
    NotFoundError:
      description: Bản ghi không tồn tại trong hệ thống (HTTP 404)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: NOT_FOUND
              message:
                type: string
                example: Tài nguyên yêu cầu không tồn tại
    BadRequestError:
      description: Yêu cầu không hợp lệ hoặc vi phạm logic nghiệp vụ (HTTP 400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimitError:
      description: Vượt quá giới hạn tần suất gửi yêu cầu (HTTP 429)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: RATE_LIMIT_EXCEEDED
              message:
                type: string
                example: Bạn đã thao tác quá nhanh. Vui lòng thử lại sau 60 giây.
  schemas:
    ApiSuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thực hiện thành công
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: BUSINESS_LOGIC_ERROR
        message:
          type: string
          example: Thông báo chi tiết về lỗi phát sinh
    PaginationMeta:
      type: object
      properties:
        trang_hien_tai:
          type: integer
          example: 1
        tong_so_trang:
          type: integer
          example: 5
        tong_so_ban_ghi:
          type: integer
          example: 98
        kich_thuoc_trang:
          type: integer
          example: 20
    User:
      type: object
