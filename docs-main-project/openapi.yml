      summary: Xem chi tiết sự kiện & Thẻ OpenGraph
      description: |
        - Ánh xạ: `UC-DISC-02`
        - Trả về thông tin đầy đủ, trạng thái số vé, thông tin Host/Co-hosts, và định hướng trạng thái nút bấm thông minh (Smart Action Button State: `REGISTER`, `WAITLIST`, `ALREADY_REGISTERED`, `CLOSED_AT_T2H`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
          description: Thao tác thành công
        '404':
          $ref: '#/components/responses/NotFoundError'
  /events/{id}/book:
    post:
      tags:
        - Booking & Waitlist
      summary: Đăng ký vé Concurrency (Khóa dòng Sinh viên & Chống trùng lịch cá nhân)
      description: |
        - Ánh xạ: `UC-BOOK-01`
        - Bắt buộc tuân thủ Thứ tự Khóa Dòng 6 Cấp:
          `tai_khoan (FOR UPDATE) -> su_kien (FOR UPDATE) -> dang_ky -> hang_doi_waitlist`.
        - Kiểm tra chống trùng lịch cá nhân:
          + Chặn tuyệt đối (Hard Block) nếu trùng khung giờ với sự kiện giới hạn slot khác đang có vé hợp lệ (`khong_gioi_han_slot = 0`).
          + Cho phép nhưng kèm cảnh báo mềm (Soft Warning) nếu 1 trong 2 là sự kiện mở tự do.
        - Khấu trừ nguyên tử `so_ve_con_lai = so_ve_con_lai - 1`.
        - Ký mã vé bằng thuật toán HMAC-SHA256 bí mật.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Đăng ký vé thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng ký vé tham dự thành công
                  data:
                    $ref: '#/components/schemas/Ticket'
        '409':
          description: Hết vé hoặc trùng lịch cá nhân
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /events/{id}/waitlist:
    post:
      tags:
        - Booking & Waitlist
      summary: Tham gia Hàng đợi Danh sách Chờ (Waitlist FIFO)
      description: |
        - Ánh xạ: `UC-BOOK-02`
        - Chỉ áp dụng cho sự kiện giới hạn slot (`khong_gioi_han_slot = 0`) khi `so_ve_con_lai = 0`.
        - Cổng đăng ký Waitlist đóng tại mốc $T-2\text{h}$.
        - Cấp số thứ tự FIFO: `COALESCE(MAX(so_thu_tu), 0) + 1` được bảo vệ bởi khóa dòng `su_kien`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đã vào hàng đợi danh sách chờ
                  data:
                    type: object
                    properties:
                      so_thu_tu:
                        type: integer
                        example: 5
                      trang_thai:
                        type: string
                        example: WAITING
          description: Khởi tạo tài nguyên thành công
  /waitlist/my-offers:
    get:
      tags:
        - Booking & Waitlist
      summary: Kiểm tra các suất vé chuyển tiếp đang được mời (Active Offers)
      description: Ánh xạ `UC-BOOK-03`. Lấy danh sách các slot đang ở trạng thái `OFFERED` kèm hạn chót xác nhận.
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaitlistOffer'
          description: Thao tác thành công
  /waitlist/{id}/claim:
    post:
      tags:
        - Booking & Waitlist
      summary: Xác nhận nhận vé chuyển tiếp trong Claim Window
      description: |
        - Ánh xạ: `UC-BOOK-03`
        - Thời hạn Claim Window: `han_chot_xac_nhan = min(NOW() + 60m, T - 2h)`.
        - Kiểm tra lại trùng lịch cá nhân dưới khóa giao dịch.
        - Khởi tạo vé `DaDangKy` chính thức kèm HMAC-SHA256, chuyển trạng thái waitlist sang `CLAIMED`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Mã `ma_hang_doi`
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Nhận vé chuyển tiếp thành công
                  data:
                    $ref: '#/components/schemas/Ticket'
          description: Thao tác thành công
        '400':
          description: Đã quá hạn Claim Window hoặc không hợp lệ
  /tickets/my-tickets:
    get:
      tags:
        - My Tickets & Cancellation
      summary: Lấy danh sách vé tham dự của sinh viên
      description: Ánh xạ `UC-TCK-01`.
      security:
        - BearerAuth: []
      parameters:
        - name: trang_thai
          in: query
          schema:
            type: string
            enum:
              - DaDangKy
              - DaCheckIn
              - DaCheckOut
              - DaHuy
              - ViPhamNoShow
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
          description: Thao tác thành công
  /tickets/{id}:
    get:
      tags:
        - My Tickets & Cancellation
      summary: Chi tiết vé cá nhân & Payload QR tích hợp Screen Wake Lock
      description: Ánh xạ `UC-TCK-01`. Trả về chuỗi mã hóa vé HMAC-SHA256 để render mã QR tại app di động và chỉ dẫn giữ sáng màn hình.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TicketDetail'
          description: Thao tác thành công
  /tickets/{id}/cancel:
    post:
      tags:
        - My Tickets & Cancellation
      summary: Hủy vé cá nhân trước mốc T-4h (Khóa hủy vé tại T-4h)
      description: |
        - Ánh xạ: `UC-TCK-02`
        - Ràng buộc bất biến cốt lõi: Chỉ cho phép hủy khi `NOW() < thoi_gian_bat_dau - 4h`.
        - Cố tình hủy sau $T-4\text{h}$ trả về lỗi `400 CANNOT_CANCEL_WITHIN_4_HOURS`.
        - Nếu thời gian còn lại đến $T-2\text{h} \ge 15\text{m}$ và có Waitlist: Chuyển người đầu tiên sang `OFFERED`.
        - Nếu thời gian còn lại đến $T-2\text{h} < 15\text{m}$ và có Waitlist: Tăng suất đóng băng `so_slot_dong_bang = so_slot_dong_bang + 1` (chống chen ngang).
        - Nếu không có Waitlist: Hoàn trả vào `so_ve_con_lai`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
        '400':
          description: Đã qua mốc khóa hủy vé T-4h
  /events/{id}/kiosk/start:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Kích hoạt phiên trình chiếu Kiosk TOTP 30s tại hội trường
      description: |
        - Ánh xạ: `UC-OPS-01`
        - Quản lý độc lập tại bảng `phien_kiosk`.
        - Sinh `kiosk_session_token` và seed bí mật `totp_secret` (RFC 6238).
        - Phiên Kiosk không bị đăng xuất khi BTC đăng nhập thiết bị khác.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      ma_phien:
                        type: string
                        example: kiosk_sess_abc123
                      kiosk_token:
                        type: string
                        example: kiosk_tok_secret999
                      thoi_gian_het_han:
                        type: string
                        format: date-time
          description: Thao tác thành công
  /kiosk/totp-stream:
    get:
      tags:
        - Attendance & Anti-Fraud
      summary: Lấy chuỗi mã TOTP xoay vòng mỗi 30s cho màn chiếu Kiosk
      description: Yêu cầu Header `X-Kiosk-Token`. Sinh mã QR động thời gian thực hiển thị trên màn chiếu lớn.
      security:
        - KioskTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totp_code:
                        type: string
                        example: '847291'
                      expires_in_seconds:
                        type: integer
                        example: 28
          description: Thao tác thành công
  /events/{id}/kiosk/open-checkout:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Mở cổng Check-out sớm trước mốc T_end-25m (Cần Override Code & Lý do)
      description: Cổng Check-out mặc định khóa cứng đến $T_{end}-25\text{m}$. Mở sớm bắt buộc nhập mã xác nhận và lưu nhật ký kiểm toán.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ma_xac_nhan
                - ly_do_mo_som
              properties:
                ma_xac_nhan:
                  type: string
                ly_do_mo_som:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /attendance/staff-scan:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Soát vé Check-in tại Bàn đón tiếp qua Chữ ký số HMAC (< 2.0s)
      description: |
        - Ánh xạ: `UC-OPS-02`
        - Dành cho Nhân viên soát vé (Staff) tại cổng.
        - Giải mã chuỗi vé, kiểm tra `hash_equals()`, trả về thông tin sinh viên và cờ cảnh báo đối soát thẻ sinh viên nếu có nghi vấn.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ma_su_kien
                - chuoi_qr_ve
              properties:
                ma_su_kien:
                  type: integer
                chuoi_qr_ve:
                  type: string
                  example: CEH-TICKET-22520001-HMAC_SIGNATURE_HERE
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      sinh_vien:
                        type: object
                        properties:
                          ho_ten:
                            type: string
                            example: Nguyễn Văn An
                          mssv:
                            type: string
                            example: '22520001'
                          lop:
                            type: string
                            example: HTTT2022
                      canh_bao_doi_soat_the_sv:
                        type: boolean
                        example: false
                      trang_thai_ve:
                        type: string
                        example: DaCheckIn
          description: Thao tác thành công
  /attendance/self-check-in:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Sinh viên tự quét mã Dynamic TOTP QR Check-in (Device Binding)
      description: |
        - Ánh xạ: `UC-OPS-03`
        - Kiểm tra mã TOTP xoay vòng 30 giây (bù trễ mạng $\pm 1$ chu kỳ = tối đa 60s).
        - Kiểm tra Device Binding: Bắt buộc gửi Header `X-Device-Id`. Nếu 1 thiết bị quét cho $\ge 2$ tài khoản trong cùng sự kiện, hệ thống gắn cờ `nghi_van_gian_lan = 1` và yêu cầu Staff đối soát thẻ sinh viên.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            example: device_fingerprint_uuid_123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ma_su_kien
                - totp_code
              properties:
                ma_su_kien:
                  type: integer
                totp_code:
                  type: string
                  example: '847291'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
        '403':
          description: Gian lận thiết bị hoặc sai mã TOTP
  /attendance/self-check-out:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Sinh viên tự quét Dynamic TOTP QR Check-out (Tính thời lượng thực tế Delta t)
      description: |
        - Ánh xạ: `UC-OPS-03`
        - Công thức thời lượng tham gia:
          `Delta t = min(CheckOut, ThoiGianKetThucThucTe) - max(CheckIn, ThoiGianBatDauKeHoach)`.
        - Phân bậc ĐRL tự động:
          + `Delta t >= 60%`: Hưởng 100% ĐRL.
          + `30% <= Delta t < 60%`: Hưởng 50% ĐRL.
          + `Delta t < 30%`: Hưởng 0% ĐRL.
      security:
        - BearerAuth: []
      parameters:
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ma_su_kien
                - totp_code
              properties:
                ma_su_kien:
                  type: integer
                totp_code:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Điểm danh Check-out thành công
                  data:
                    type: object
                    properties:
                      thoi_luong_phut:
                        type: integer
                        example: 105
                      ti_le_thoi_luong:
                        type: number
                        example: 0.875
                      ti_le_drl:
                        type: integer
                        enum:
                          - 0
                          - 50
                          - 100
                        example: 100
          description: Thao tác thành công
  /attendance/manual-override:
    post:
      tags:
        - Attendance & Anti-Fraud
      summary: Điều chỉnh điểm danh thủ công & Xóa cờ No-show (Có Audit Log)
      description: Ánh xạ `UC-OPS-04`. Dành cho BTC / Admin cứu xét sinh viên gặp sự cố. Bắt buộc nhập lý do, lưu vết `nhat_ky_diem_danh`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
