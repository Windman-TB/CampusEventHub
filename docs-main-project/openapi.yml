openapi: 3.0.3
info:
  title: Campus Event Hub API Contract
  version: 3.1.2
  description: |
    # Campus Event Hub — Enterprise API Specification (SSOT Baseline v3.1.2)
    Đồ án Môn học: Phát triển Ứng dụng Web (IS207.R11) – Khoa Hệ thống Thông tin, Trường ĐH Công nghệ Thông tin (UIT).

    Tài liệu đặc tả toàn diện chuẩn OpenAPI 3.0.3 ánh xạ 1-1 với:
    - **SRS v3.1.2** (`docs-main-project/srs_v3.1.2.md`): 32 Use Cases trên 11 Phân hệ nghiệp vụ.
    - **Database Design v3.1.2** (`docs-main-project/database_design_v3.1.2.md` & `database_v3.1.2_mysql.sql`): 24 Bảng 3NF, 3 Views.
    - **Quy tắc Bất biến Toàn cục:** Khóa dòng 6 cấp (`tai_khoan -> phong -> dat_phong -> su_kien -> dang_ky -> hang_doi_waitlist`), TOTP 30s Kiosk, HMAC-SHA256, Chốt hủy vé $T-4\text{h}$, Đóng Waitlist $T-2\text{h}$, Chốt Check-out $T_{end}-25\text{m}$, Che mờ PII Nghị định 13/2023/NĐ-CP.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server (Laravel 11)
  - url: https://campuseventhub.uit.edu.vn/api/v1
    description: Production Environment
tags:
  - name: Auth & Account
    description: Xác thực, Đăng ký OTP, Đăng nhập Single Active Session, Hồ sơ (UC-AUTH-01 -> 05)
  - name: Admin & Organizations
    description: Quản trị Cây Đơn vị Tổ chức & Cấp phát User Nội bộ (UC-ADM-01)
  - name: Venues & Room Schedules
    description: Quản lý Phòng ốc & Kiểm tra Xung đột Lịch đệm 15p (UC-ROOM-01, UC-ROOM-02)
  - name: Event Lifecycle & Approvals
    description: Khởi tạo, Soft Hold 48h Co-host, Duyệt Đa cấp Host-driven, Hủy khẩn cấp (UC-EVT-01 -> 03)
  - name: Event Discovery
    description: Khám phá, Tìm kiếm Full-Text & Thẻ OpenGraph (UC-DISC-01, UC-DISC-02)
  - name: Booking & Waitlist
    description: Đặt vé Tương tranh, Chống trùng lịch cá nhân, Waitlist FIFO & Claim Window (UC-BOOK-01 -> 03)
  - name: My Tickets & Cancellation
    description: Quản lý Vé Cá nhân, Screen Wake Lock & Khóa Hủy vé T-4h (UC-TCK-01, UC-TCK-02)
  - name: Attendance & Anti-Fraud
    description: Kiosk Dynamic TOTP 30s, Soát vé HMAC Staff, Check-in/out 2 chiều, Device Binding (UC-OPS-01 -> 05)
  - name: Feedback, Certificate & DRL
    description: Khảo sát 48h, e-Certificate SHA-256 Che PII, Khóa chốt Bảng ĐRL CTSV (UC-FEED-01, UC-CERT-01, UC-DRL-01)
  - name: Reports & Notifications
    description: Dashboard BTC, BI Vĩ mô Toàn trường, Thông báo In-app & Email 24h (UC-REP-01, UC-REP-02, UC-NOTIF-01)
  - name: AI Assistant
    description: Organizer Content & Analytics Copilot, Admin BI Text-to-Insight Read-Only (UC-AI-01, UC-AI-02)
paths:
  /auth/register:
    post:
      tags:
        - Auth & Account
      summary: Đăng ký tài khoản Sinh viên (Email OTP & Đối chiếu MSSV)
      description: |
        - Ánh xạ: `UC-AUTH-01`
        - Ràng buộc: Email phải có đuôi `@gm.uit.edu.vn`. Tiền tố email bắt buộc khớp chính xác với MSSV (8 chữ số).
        - Bắt buộc đồng thuận Nghị định 13/2023/NĐ-CP.
        - Mật khẩu băm Bcrypt (cost 12), sinh OTP 6 số lưu bảng đệm `dang_ky_tam_thoi`.
      operationId: registerStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ho_ten
                - mssv
                - email
                - mat_khau
                - xac_nhan_mat_khau
                - dong_y_nghi_dinh_13
              properties:
                ho_ten:
                  type: string
                  example: Nguyễn Văn An
                mssv:
                  type: string
                  pattern: ^[0-9]{8}$
                  example: '22520001'
                email:
                  type: string
                  format: email
                  example: 22520001@gm.uit.edu.vn
                so_dien_thoai:
                  type: string
                  pattern: ^[0-9]{10}$
                  example: '0901234567'
                lop_sinh_hoat:
                  type: string
                  example: HTTT2022
                ma_khoa:
                  type: integer
                  example: 1
                  description: Khóa ngoại trỏ đến `don_vi_to_chuc` (Khoa)
                mat_khau:
                  type: string
                  format: password
                  minLength: 8
                  example: MatKhau@123
                xac_nhan_mat_khau:
                  type: string
                  format: password
                  example: MatKhau@123
                dong_y_nghi_dinh_13:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Đã gửi mã OTP kích hoạt đến email trường
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/verify-registration-otp:
    post:
      tags:
        - Auth & Account
      summary: Xác thực OTP hoàn tất đăng ký tài khoản
      description: Kiểm tra mã OTP 6 số trong vòng 10 phút. Nếu hợp lệ, ghi vào bảng `tai_khoan`.
      operationId: verifyRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: 22520001@gm.uit.edu.vn
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                  example: '123456'
      responses:
        '201':
          description: Tài khoản đã kích hoạt thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tài khoản kích hoạt thành công
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /auth/login:
    post:
      tags:
        - Auth & Account
      summary: Đăng nhập hệ thống (Single Active Session cho SV)
      description: |
        - Ánh xạ: `UC-AUTH-02`
        - Hủy phiên cũ ngay lập tức nếu vai trò là `SinhVien` (Single Active Session).
        - Trả về Bearer Token / Sanctum Cookie.
        - Kiểm tra cờ `buoc_doi_mat_khau`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - mat_khau
              properties:
                email:
                  type: string
                  format: email
                  example: 22520001@gm.uit.edu.vn
                mat_khau:
                  type: string
                  format: password
                  example: MatKhau@123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 1|laravelsanctumtoken123456
                      user:
                        $ref: '#/components/schemas/User'
                      buoc_doi_mat_khau:
                        type: boolean
                        example: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/logout:
    post:
      tags:
        - Auth & Account
      summary: Đăng xuất & Thu hồi phiên làm việc tức thì
      description: Ánh xạ `UC-AUTH-05`. Thu hồi token hiện tại trong `personal_access_tokens` / xóa bản ghi `sessions`.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
  /auth/me:
    get:
      tags:
        - Auth & Account
      summary: Lấy thông tin tài khoản đang đăng nhập
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
          description: Thao tác thành công
  /auth/profile:
    put:
      tags:
        - Auth & Account
      summary: Cập nhật thông tin hồ sơ cá nhân
      description: Ánh xạ `UC-AUTH-03`. Sinh viên chỉ được sửa SĐT, avatar. MSSV và Email bị khóa.
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                so_dien_thoai:
                  type: string
                  pattern: ^[0-9]{10}$
                avatar_url:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /auth/change-password:
    post:
      tags:
        - Auth & Account
      summary: Đổi mật khẩu tài khoản
      description: Kiểm tra mật khẩu cũ, băm mật khẩu mới bằng Bcrypt, reset cờ `buoc_doi_mat_khau = 0`.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mat_khau_cu
                - mat_khau_moi
                - xac_nhan_mat_khau_moi
              properties:
                mat_khau_cu:
                  type: string
                mat_khau_moi:
                  type: string
                  minLength: 8
                xac_nhan_mat_khau_moi:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /auth/forgot-password:
    post:
      tags:
        - Auth & Account
      summary: Yêu cầu OTP khôi phục mật khẩu
      description: Ánh xạ `UC-AUTH-04`. Chống dò quét email, sinh OTP 6 số lưu vào `otp_quen_mat_khau`.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /auth/reset-password:
    post:
      tags:
        - Auth & Account
      summary: Đặt lại mật khẩu bằng mã OTP
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - mat_khau_moi
                - xac_nhan_mat_khau_moi
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                mat_khau_moi:
                  type: string
                  minLength: 8
                xac_nhan_mat_khau_moi:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /admin/organizations:
    get:
      tags:
        - Admin & Organizations
      summary: Lấy danh sách cây đơn vị tổ chức
      description: Trả về phân cấp Đơn vị (Khoa, CLB trực thuộc Khoa qua `ma_don_vi_cha`).
      operationId: getOrganizations
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
          description: Thao tác thành công
    post:
      tags:
        - Admin & Organizations
      summary: Tạo mới đơn vị tổ chức
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ten_don_vi
                - ma_dinh_danh
                - loai_don_vi
              properties:
                ten_don_vi:
                  type: string
                ma_dinh_danh:
                  type: string
                  example: CLB_WEBDEV
                loai_don_vi:
                  type: string
                  enum:
                    - CLB
                    - DoanHoi
                    - Khoa
                    - PhongBan
                ma_don_vi_cha:
                  type: integer
                  nullable: true
                mo_ta:
                  type: string
                logo_url:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Organization'
          description: Khởi tạo tài nguyên thành công
  /admin/users:
    get:
      tags:
        - Admin & Organizations
      summary: Quản trị danh sách người dùng toàn trường
      security:
        - BearerAuth: []
      parameters:
        - name: vai_tro
          in: query
          schema:
            type: string
            enum:
              - SinhVien
              - ToChuc
              - Admin
        - name: ma_don_vi_to_chuc
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
          description: Thao tác thành công
    post:
      tags:
        - Admin & Organizations
      summary: Cấp phát tài khoản Cán bộ / Ban tổ chức nội bộ
      description: Email bắt buộc `@uit.edu.vn`. Cờ `buoc_doi_mat_khau = 1`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ho_ten
                - email
                - vai_tro
                - ma_don_vi_to_chuc
              properties:
                ho_ten:
                  type: string
                email:
                  type: string
                  format: email
                  example: canbo@uit.edu.vn
                vai_tro:
                  type: string
                  enum:
                    - ToChuc
                    - Admin
                ma_don_vi_to_chuc:
                  type: integer
                so_dien_thoai:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Tạo tài khoản nội bộ thành công. Mật khẩu tạm đã được gửi tới email.
          description: Khởi tạo tài nguyên thành công
  /rooms:
    get:
      tags:
        - Venues & Room Schedules
      summary: Lấy danh mục phòng học & hội trường
      description: Ánh xạ `UC-ROOM-01`.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
          description: Thao tác thành công
    post:
      tags:
        - Venues & Room Schedules
      summary: Tạo mới phòng / hội trường (Admin)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ten_phong
                - suc_chua_toi_da
              properties:
                ten_phong:
                  type: string
                  example: Hội trường A
                vi_tri:
                  type: string
                  example: Tòa A - Tầng 1
                suc_chua_toi_da:
                  type: integer
                  example: 300
                co_may_chieu:
                  type: boolean
                  default: true
                co_am_thanh:
                  type: boolean
                  default: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Room'
          description: Khởi tạo tài nguyên thành công
  /rooms/{id}/availability:
    get:
      tags:
        - Venues & Room Schedules
      summary: Kiểm tra tính khả dụng của phòng (Đệm an toàn 15 phút)
      description: |
        - Ánh xạ: `UC-ROOM-02`
        - Tự động cộng đệm an toàn 15 phút trước và sau sự kiện:
          `[bat_dau - 15m, ket_thuc + 15m]`.
        - Loại trừ các bản ghi Soft Hold 48h đã hết hạn (`han_giu_cho_tam < NOW()`).
        - Loại trừ chính sự kiện hiện hành nếu đang trong chế độ chỉnh sửa (`exclude_event_id`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: thoi_gian_bat_dau
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: thoi_gian_ket_thuc
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: exclude_event_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      kha_dung:
                        type: boolean
                        example: true
                      ly_do_xung_dot:
                        type: string
                        nullable: true
                      su_kien_trung:
                        type: object
                        nullable: true
                        properties:
                          ma_su_kien:
                            type: integer
                          ten_su_kien:
                            type: string
                          thoi_gian_bat_dau:
                            type: string
                            format: date-time
                          thoi_gian_ket_thuc:
                            type: string
                            format: date-time
          description: Thao tác thành công
  /events:
    get:
      tags:
        - Event Discovery
      summary: Tìm kiếm toàn văn & Lọc sự kiện đa tiêu chí
      description: Ánh xạ `UC-DISC-01`. Hỗ trợ Full-Text Search, phân trang, lọc theo chuyên đề, trạng thái, thời gian.
      parameters:
        - name: q
          in: query
          description: Từ khóa tìm kiếm toàn văn
          schema:
            type: string
        - name: ma_chuyen_de
          in: query
          schema:
            type: integer
        - name: ma_don_vi_to_chuc
          in: query
          schema:
            type: integer
        - name: trang_thai
          in: query
          schema:
            type: string
            enum:
              - PUBLISHED
              - HAPPENING
              - COMPLETED
        - name: tu_ngay
          in: query
          schema:
            type: string
            format: date
        - name: den_ngay
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventCard'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
          description: Thao tác thành công
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Soạn thảo sự kiện mới (Bản nháp DRAFT)
      description: |
        - Ánh xạ: `UC-EVT-01`
        - Bắt buộc kiểm tra sức chứa phòng: `so_luong_toi_da <= phong.suc_chua_toi_da` (khi `khong_gioi_han_slot = false`).
        - Chọn danh sách đơn vị phối hợp (Co-hosts).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ten_su_kien
                - ma_chuyen_de
                - ma_phong
                - thoi_gian_bat_dau
                - thoi_gian_ket_thuc
                - han_chot_dang_ky
                - diem_ren_luyen
              properties:
                ten_su_kien:
                  type: string
                mo_ta:
                  type: string
                ma_chuyen_de:
                  type: integer
                ma_phong:
                  type: integer
                khong_gioi_han_slot:
                  type: boolean
                  default: false
                so_luong_toi_da:
                  type: integer
                  example: 100
                thoi_gian_bat_dau:
                  type: string
                  format: date-time
                thoi_gian_ket_thuc:
                  type: string
                  format: date-time
                han_chot_dang_ky:
                  type: string
                  format: date-time
                diem_ren_luyen:
                  type: integer
                  minimum: 1
                  maximum: 20
                  example: 5
                anh_poster_url:
                  type: string
                danh_sach_co_host_ids:
                  type: array
                  items:
                    type: integer
                  description: Danh sách `ma_don_vi_to_chuc` của các đơn vị đồng tổ chức
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EventDetail'
          description: Khởi tạo tài nguyên thành công
  /events/{id}/submit-approval:
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Gửi đề xuất phê duyệt (Soft Hold 48h Co-host & Host-driven Routing)
      description: |
        - Ánh xạ: `UC-EVT-02`
        - Nếu có Co-host: Chuyển `WAITING_COHOST_CONFIRM`, tạo bản ghi giữ phòng tạm thời 48h (`han_giu_cho_tam = NOW() + 48h`).
        - Nếu không có Co-host & Host là CLB cấp Khoa: Chuyển `PENDING_FACULTY`.
        - Nếu không có Co-host & Host là Cấp Trường / Văn phòng Khoa: Chuyển thẳng `PENDING_ADMIN`.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
        '409':
          description: Xung đột lịch phòng hoặc không thỏa mãn trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /events/{id}/co-host-respond:
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Đơn vị đồng tổ chức xác nhận phản hồi (Đồng ý / Từ chối)
      description: |
        - Ánh xạ: `UC-EVT-02`
        - Nếu có 1 bên từ chối: Chuyển ngay sang `COHOST_REJECTED` và hủy Soft Hold phòng.
        - Nếu 100% bên đồng ý: Tự động xóa `han_giu_cho_tam` và chuyển tiếp theo luồng Host-driven Routing.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trang_thai_xac_nhan
              properties:
                trang_thai_xac_nhan:
                  type: string
                  enum:
                    - DONG_Y
                    - TU_CHOI
                ly_do:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /events/{id}/withdraw:
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Đơn vị chủ trì (Host A) chủ động rút đề xuất sự kiện
      description: Ánh xạ `UC-EVT-02`, `UC-EVT-03`. Chuyển trạng thái từ `WAITING_COHOST_CONFIRM`, `PENDING_FACULTY` hoặc `PENDING_ADMIN` quay về `DRAFT`. Hủy Soft Hold phòng.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ly_do_rut
              properties:
                ly_do_rut:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /events/{id}/review:
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Thẩm định phê duyệt sự kiện (Khoa / CTSV duyệt / Admin duyệt thay)
      description: |
        - Ánh xạ: `UC-EVT-02`, `UC-EVT-03`.
        - Cấp Khoa: `PENDING_FACULTY` -> `PENDING_ADMIN` (Duyệt) hoặc `REJECTED` (Từ chối).
        - Cấp Trường: `PENDING_ADMIN` -> `APPROVED` (xác nhận `dat_phong = CONFIRMED`).
        - Admin có quyền duyệt thay Khoa (`PENDING_FACULTY` -> `APPROVED`).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hanh_dong
              properties:
                hanh_dong:
                  type: string
                  enum:
                    - PHE_DUYET
                    - TU_CHOI
                    - YEU_CAU_CHINH_SUA
                ghi_chu_kiem_duyet:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /events/{id}/emergency-cancel:
    post:
      tags:
        - Event Lifecycle & Approvals
      summary: Hủy sự kiện khẩn cấp (Host A hoặc Admin)
      description: |
        - Ánh xạ: `UC-EVT-03`.
        - Áp dụng khi sự kiện ở trạng thái `APPROVED` hoặc `PUBLISHED`.
        - Tuân thủ thứ tự khóa dòng triệt tiêu deadlock.
        - Chuyển trạng thái `CANCELLED`, giải phóng `dat_phong`, hủy toàn bộ vé và xếp hàng gửi email broadcast.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ly_do_huy
              properties:
                ly_do_huy:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessMessage'
          description: Thao tác thành công
  /events/{id}:
    get:
      tags:
