        ma_tai_khoan:
          type: integer
          example: 1
        ho_ten:
          type: string
          example: Nguyễn Văn An
        mssv:
          type: string
          example: '22520001'
          nullable: true
        email:
          type: string
          format: email
          example: 22520001@gm.uit.edu.vn
        vai_tro:
