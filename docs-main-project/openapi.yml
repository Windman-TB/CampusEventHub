      description: |
        - Ánh xạ: `UC-CERT-01`
        - Dành cho nhà tuyển dụng hoặc công chúng xác thực chữ ký HMAC-SHA256.
        - Bắt buộc che mờ thông tin cá nhân: Họ tên `Nguyễn V** A`, MSSV `2252****`, tuyệt đối không để lộ email/SĐT.
